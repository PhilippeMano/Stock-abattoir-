<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion Stock Abattoir</title>
<meta name="theme-color" content="#1C2B2E">
<style>
  :root{
    --bg:#F2F0EA;
    --surface:#FFFFFF;
    --ink:#1C2B2E;
    --ink-soft:#5B6B6E;
    --line:#E3DFD2;
    --blue:#3E6E8E;
    --blue-soft:#E7EEF2;
    --amber:#D98A2B;
    --amber-soft:#FAEEDC;
    --green:#4C8C5B;
    --green-soft:#E7F1E9;
    --red:#C0453A;
    --red-soft:#F7E7E5;
    --radius:14px;
    --font-display:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{padding-bottom:76px;min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);font-stretch:condensed;letter-spacing:.03em;margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}

  /* HEADER */
  header.topbar{
    background:var(--ink);color:#fff;padding:16px 18px 18px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  header.topbar .brand{display:flex;flex-direction:column;gap:2px;}
  header.topbar .brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9FB2B6;}
  header.topbar .brand h1{font-size:20px;text-transform:uppercase;}
  header.topbar .gear{background:none;border:none;color:#fff;font-size:20px;padding:6px;border-radius:8px;}
  header.topbar .gear:active{background:rgba(255,255,255,.12);}

  main{max-width:960px;margin:0 auto;padding:16px;}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(28,43,46,.04), 0 2px 8px rgba(28,43,46,.05);}
  .card h2{font-size:13px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:10px;}
  .card .sub{font-size:12px;color:var(--ink-soft);margin:-8px 0 14px;}

  /* PIPELINE SIGNATURE — icônes en badge, chiffres libres en dessous (jamais tronqués) */
  .pipeline{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:6px 2px 0;}
  .pipeline:before{content:"";position:absolute;top:22px;left:22px;right:22px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--blue),var(--ink),var(--amber),var(--green));}
  .pipeline .stage{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:0;position:relative;z-index:1;}
  .pipeline .icon-badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#fff;border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.16);flex-shrink:0;}
  .pipeline .stage:nth-child(1) .icon-badge{background:var(--blue);}
  .pipeline .stage:nth-child(2) .icon-badge{background:var(--ink);}
  .pipeline .stage:nth-child(3) .icon-badge{background:var(--amber);}
  .pipeline .stage:nth-child(4) .icon-badge{background:var(--green);}
  .pipeline .stage .num{font-family:var(--font-mono);font-weight:800;font-size:19px;color:var(--ink);margin-top:8px;
    line-height:1.1;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
  .pipeline .stage .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    text-align:center;font-weight:700;margin-top:3px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{border-radius:12px;padding:14px 16px;border:1px solid transparent;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(28,43,46,.04);}
  .stat:before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;}
  .stat .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .stat .ic{font-size:15px;opacity:.65;}
  .stat .n{font-family:var(--font-mono);font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.01em;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .stat.blue{background:var(--blue-soft);} .stat.blue:before{background:var(--blue);} .stat.blue .n{color:var(--blue);}
  .stat.amber{background:var(--amber-soft);} .stat.amber:before{background:var(--amber);} .stat.amber .n{color:var(--amber);}
  .stat.green{background:var(--green-soft);} .stat.green:before{background:var(--green);} .stat.green .n{color:var(--green);}
  .stat.red{background:var(--red-soft);} .stat.red:before{background:var(--red);} .stat.red .n{color:var(--red);}

  .quickrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .btn{border:none;border-radius:11px;padding:13px 16px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--ink);color:#fff;flex:1;justify-content:center;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:none;border:1.5px solid var(--line);color:var(--ink);}
  .btn-ghost{background:none;border:none;color:var(--blue);font-weight:600;padding:6px 4px;}
  .btn:active{transform:scale(.97);}
  .btn.full{width:100%;justify-content:center;}

  .list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
  .list-row .body{flex:1;min-width:0;}
  .list-row .body .t1{font-weight:600;font-size:14.5px;}
  .list-row .body .t2{font-size:12.5px;color:var(--ink-soft);}
  .list-row .qty{font-family:var(--font-mono);font-weight:700;font-size:14.5px;text-align:right;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:26px 10px;}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.low{background:var(--red-soft);color:var(--red);}

  .filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
  .chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;background:#fff;color:var(--ink-soft);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .article-card{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);}
  .article-card:last-child{border-bottom:none;}
  .article-card .bar{width:6px;align-self:stretch;border-radius:4px;}
  .article-card .info{flex:1;}
  .article-card .info .n{font-weight:600;font-size:14.5px;}
  .article-card .info .s{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);}

  /* NAV */
  nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  nav.bottomnav button{flex:1;background:none;border:none;padding:8px 1px 7px;display:flex;flex-direction:column;
    align-items:center;gap:2px;color:var(--ink-soft);font-size:9px;font-weight:600;min-width:0;}
  nav.bottomnav button .ic{font-size:16.5px;}
  nav.bottomnav button.active{color:var(--blue);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(28,43,46,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 18px 24px;}
  @media(min-width:720px){.overlay{align-items:center;} .sheet{border-radius:18px;max-height:88vh;}}
  .sheet .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet .sheet-head h3{font-size:18px;text-transform:uppercase;}
  .sheet .close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--ink-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}

  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:opacity .25s,bottom .25s;pointer-events:none;}
  .toast.show{opacity:1;bottom:100px;}

  .receipt{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-top:6px;font-size:13.5px;}
  .receipt div{display:flex;justify-content:space-between;padding:3px 0;}
  .wa-btn{background:#25D366;color:#fff;}

  /* INSTALL BANNER */
  .install-banner{display:none;align-items:center;gap:12px;background:linear-gradient(100deg,var(--blue),var(--amber));
    color:#fff;padding:12px 14px;margin:0 0 14px;border-radius:14px;}
  .install-banner.show{display:flex;}
  .install-banner img{width:44px;height:44px;border-radius:10px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .install-banner .txt{flex:1;min-width:0;}
  .install-banner .txt b{display:block;font-size:14px;}
  .install-banner .txt span{display:block;font-size:12px;opacity:.9;}
  .install-banner .acts{display:flex;flex-direction:column;gap:6px;}
  .install-banner button{border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .install-banner .go{background:#fff;color:var(--ink);}
  .install-banner .dismiss{background:rgba(255,255,255,.18);color:#fff;}

  /* DESKTOP LAYOUT */
  @media(min-width:860px){
    body{padding-bottom:0;padding-left:220px;}
    nav.bottomnav{top:0;bottom:0;left:0;right:auto;width:220px;flex-direction:column;border-top:none;border-right:1px solid var(--line);
      padding-top:100px;gap:2px;}
    nav.bottomnav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 20px;font-size:13.5px;}
    header.topbar{position:fixed;top:0;left:220px;right:0;}
    main{padding:24px 28px;max-width:900px;}
    body{padding-top:78px;}
    .stat-grid{grid-template-columns:1fr 1fr 1fr 1fr;}
  }
  ::-webkit-scrollbar{width:0;height:0;}

  /* PRINT / PDF REPORT */
  #printArea{display:none;}
  .print-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:18px;}
  .print-header h1{font-size:22px;text-transform:uppercase;}
  .print-header .meta{text-align:right;font-size:12px;color:#555;}
  .print-title{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:14px;}
  .print-stats{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .print-stats div{border:1px solid #ccc;border-radius:8px;padding:10px 16px;font-size:13px;}
  .print-stats b{display:block;font-family:var(--font-mono);font-size:17px;}
  table.print-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;}
  table.print-table th{background:var(--ink);color:#fff;text-align:left;padding:8px 10px;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  table.print-table td{padding:7px 10px;border-bottom:1px solid #ddd;}
  table.print-table tr:nth-child(even) td{background:#f7f7f4;}
  .print-footer{margin-top:24px;font-size:11px;color:#777;text-align:center;}
  @media print{
    body.print-mode > *:not(#printArea){display:none !important;}
    body.print-mode{padding:0 !important;}
    body.print-mode #printArea{display:block !important;padding:14px;color:#111;}
  }
  @media(min-width:860px){
    body.print-mode{padding-left:0 !important;padding-top:0 !important;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <small>Gestion de stock</small>
    <h1 id="bizName">Mon Abattoir</h1>
  </div>
  <button class="gear" onclick="go('reglages')">⚙</button>
</header>

<main>
  <div class="install-banner" id="installBanner"></div>
  <div id="view"></div>
</main>

<nav class="bottomnav">
  <button data-v="dashboard" onclick="go('dashboard')"><span class="ic">🏠</span>Accueil</button>
  <button data-v="arrivages" onclick="go('arrivages')"><span class="ic">🚚</span>Arrivages</button>
  <button data-v="mouvements" onclick="go('mouvements')"><span class="ic">🔄</span>Mouvements</button>
  <button data-v="ventes" onclick="go('ventes')"><span class="ic">💰</span>Ventes</button>
  <button data-v="depenses" onclick="go('depenses')"><span class="ic">🧾</span>Dépenses</button>
  <button data-v="stock" onclick="go('stock')"><span class="ic">📦</span>Stock</button>
  <button data-v="reglages" onclick="go('reglages')"><span class="ic">⚙</span>Réglages</button>
</nav>

<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= SUPABASE (connexion cloud) ================= */
const SUPABASE_URL = 'https://lheoikcjuerddnpiuyoq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoZW9pa2NqdWVyZGRucGl1eW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMjI1MDYsImV4cCI6MjA5OTc5ODUwNn0.4x5Nay2dAgSipxhXpTPNwmY5zbfP1UqMjBHFALno8Ek';
let supa = null;
try{
  if(window.supabase && window.supabase.createClient){
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn('Supabase indisponible, mode hors-ligne local', e); }

let cloudReady = false;      // true dès que la 1ère synchro cloud a réussi
let applyingRemote = false;  // évite les boucles pendant l'application d'un changement distant
const pendingPush = {};      // clés à pousser vers le cloud (debounce)
let pushTimer = null;

async function pushKeyToCloud(key, data){
  if(!supa) return;
  try{
    await supa.from('app_state').upsert({ key, data, updated_at: new Date().toISOString() });
  }catch(e){ console.warn('Sync cloud échouée pour', key, e); }
}
function scheduleCloudPush(key){
  if(!supa || applyingRemote) return;
  pendingPush[key] = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    Object.keys(pendingPush).forEach(k=>{
      delete pendingPush[k];
      const val = k==='settings'?settings : k==='articles'?articles : k==='movements'?movements : k==='expenses'?expenses : arrivals;
      pushKeyToCloud(k, val);
    });
  }, 700);
}

async function loadFromCloud(){
  if(!supa) return false;
  try{
    const { data, error } = await supa.from('app_state').select('key,data');
    if(error) throw error;
    if(!data || !data.length) return false;
    applyingRemote = true;
    data.forEach(row=>{
      if(row.key==='settings' && row.data) settings = row.data;
      if(row.key==='articles' && row.data) articles = row.data;
      if(row.key==='movements' && row.data) movements = row.data;
      if(row.key==='expenses' && row.data) expenses = row.data;
      if(row.key==='arrivals' && row.data) arrivals = row.data;
    });
    saveJSON(DB_KEYS.settings, settings);
    saveJSON(DB_KEYS.articles, articles);
    saveJSON(DB_KEYS.movements, movements);
    saveJSON(DB_KEYS.expenses, expenses);
    saveJSON(DB_KEYS.arrivals, arrivals);
    applyingRemote = false;
    return true;
  }catch(e){
    console.warn('Chargement cloud impossible, on reste en local', e);
    return false;
  }
}

function subscribeRealtime(){
  if(!supa) return;
  supa.channel('app_state_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, async ()=>{
      if(applyingRemote) return;
      await loadFromCloud();
      render();
      toast('🔄 Données synchronisées');
    })
    .subscribe();
}

async function forceSyncNow(){
  if(!supa){ toast('Supabase non disponible'); return; }
  toast('Synchronisation…');
  const ok = await loadFromCloud();
  scheduleCloudPush('settings'); scheduleCloudPush('articles'); scheduleCloudPush('movements'); scheduleCloudPush('expenses'); scheduleCloudPush('arrivals');
  cloudReady = true;
  render();
  toast(ok ? '✓ Synchronisé' : '✓ Envoyé au cloud');
}
async function initCloudSync(){
  if(!supa){ return; }
  const gotRemote = await loadFromCloud();
  cloudReady = true;
  if(!gotRemote){
    // Rien dans le cloud : on pousse l'état local initial (première mise en route)
    scheduleCloudPush('settings');
    scheduleCloudPush('articles');
    scheduleCloudPush('movements');
    scheduleCloudPush('expenses');
    scheduleCloudPush('arrivals');
  }
  subscribeRealtime();
  render();
}

/* ================= DATA LAYER ================= */
const DB_KEYS = { settings:'abattoir_settings_v1', articles:'abattoir_articles_v1', movements:'abattoir_movements_v1', expenses:'abattoir_expenses_v1', arrivals:'abattoir_arrivals_v1' };

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ toast("Erreur d'enregistrement"); } }

let settings = loadJSON(DB_KEYS.settings, { businessName:'Mon Abattoir', currency:'FCFA' });
let articles = loadJSON(DB_KEYS.articles, null);
let movements = loadJSON(DB_KEYS.movements, []);
let expenses = loadJSON(DB_KEYS.expenses, []);
let arrivals = loadJSON(DB_KEYS.arrivals, []);
const EXPENSE_CATEGORIES = ['Transport','Carburant','Emballage','Salaires','Électricité / Eau','Entretien','Achat matériel','Autre'];

if(!articles){
  articles = [
    { id: uid(), name:'Poulet entier', unit:'pièce', stock:0, threshold:10 },
    { id: uid(), name:'Découpe - Pilons', unit:'kg', stock:0, threshold:15 },
    { id: uid(), name:'Découpe - Blancs', unit:'kg', stock:0, threshold:15 },
    { id: uid(), name:'Abats', unit:'kg', stock:0, threshold:5 },
  ];
  saveJSON(DB_KEYS.articles, articles);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function persist(){
  saveJSON(DB_KEYS.settings, settings);
  saveJSON(DB_KEYS.articles, articles);
  saveJSON(DB_KEYS.movements, movements);
  saveJSON(DB_KEYS.expenses, expenses);
  saveJSON(DB_KEYS.arrivals, arrivals);
  scheduleCloudPush('settings');
  scheduleCloudPush('articles');
  scheduleCloudPush('movements');
  scheduleCloudPush('expenses');
  scheduleCloudPush('arrivals');
}
function fmtN(n){ return Number(n||0).toLocaleString('fr-FR'); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function monthKey(iso){ return (iso||'').slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isToday(iso){ return (iso||'').slice(0,10) === todayISO(); }
function isThisMonth(iso){ const d=new Date(iso), n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
function articleById(id){ return articles.find(a=>a.id===id); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* ================= FILTRE PAR PÉRIODE (réutilisable sur tous les onglets) ================= */
// Chaque onglet possède son propre état : { mode:'semaine'|'mois'|'plage', weekStr, month, from, to }
let periodStates = {
  arr: { mode:'mois', weekStr:'', month:'', from:'', to:'' },
  mv:  { mode:'mois', weekStr:'', month:'', from:'', to:'' },
  ven: { mode:'mois', weekStr:'', month:'', from:'', to:'' },
  dep: { mode:'mois', weekStr:'', month:'', from:'', to:'' },
  stk: { mode:'mois', weekStr:'', month:'', from:'', to:'' },
};
function isoWeekStr(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const day = (d.getDay()+6)%7; // lundi = 0
  d.setDate(d.getDate()-day+3); // jeudi de cette semaine
  const firstThursday = new Date(d.getFullYear(),0,4);
  const diff = d - firstThursday;
  const week = 1 + Math.round(diff/(7*24*3600*1000));
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function weekRangeFromStr(weekStr){
  if(!weekStr || !weekStr.includes('-W')) weekStr = isoWeekStr(todayISO());
  const [y,w] = weekStr.split('-W').map(Number);
  const simple = new Date(y,0,1+(w-1)*7);
  const dow = simple.getDay() || 7;
  const monday = new Date(simple);
  monday.setDate(simple.getDate() - dow + 1);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { from: monday.toISOString().slice(0,10), to: sunday.toISOString().slice(0,10) };
}
function monthRangeFromStr(month){
  const [y,m] = month.split('-').map(Number);
  const lastDay = new Date(y,m,0).getDate();
  return { from: `${month}-01`, to: `${month}-${String(lastDay).padStart(2,'0')}` };
}
function initPeriod(p){
  if(!p.month) p.month = monthKey(todayISO());
  if(!p.weekStr) p.weekStr = isoWeekStr(todayISO());
  if(!p.from) p.from = todayISO().slice(0,8)+'01';
  if(!p.to) p.to = todayISO();
}
function periodRange(p){
  initPeriod(p);
  if(p.mode==='semaine') return weekRangeFromStr(p.weekStr);
  if(p.mode==='mois') return monthRangeFromStr(p.month);
  return { from:p.from, to:p.to };
}
function periodLabel(p){
  initPeriod(p);
  if(p.mode==='semaine'){ const r=weekRangeFromStr(p.weekStr); return `semaine du ${fmtDate(r.from)} au ${fmtDate(r.to)}`; }
  if(p.mode==='mois') return cap(monthLabel(p.month));
  return `du ${fmtDate(p.from)} au ${fmtDate(p.to)}`;
}
function filterByPeriod(list, dateField, p){
  const {from,to} = periodRange(p);
  return list.filter(x=>{ const d=(x[dateField]||'').slice(0,10); return d>=from && d<=to; });
}
function getAvailableMonthsFrom(...lists){
  const set = new Set();
  lists.forEach(l=> l.forEach(x=> set.add(monthKey(x.date))));
  set.add(monthKey(todayISO()));
  return Array.from(set).sort().reverse();
}
function periodFilterBar(prefix, months){
  const p = periodStates[prefix];
  initPeriod(p);
  return `
  <div class="filters">
    <button class="chip ${p.mode==='semaine'?'active':''}" onclick="periodStates.${prefix}.mode='semaine';render();">Semaine</button>
    <button class="chip ${p.mode==='mois'?'active':''}" onclick="periodStates.${prefix}.mode='mois';render();">Mois</button>
    <button class="chip ${p.mode==='plage'?'active':''}" onclick="periodStates.${prefix}.mode='plage';render();">Plage de dates</button>
  </div>
  <div class="card" style="margin-bottom:14px;">
    ${p.mode==='semaine'? `
      <div class="field" style="margin-bottom:0;"><label>Semaine</label>
        <input type="week" value="${p.weekStr}" onchange="periodStates.${prefix}.weekStr=this.value;render();">
      </div>
    ` : p.mode==='mois'? `
      <div class="field" style="margin-bottom:0;"><label>Mois</label>
        <select onchange="periodStates.${prefix}.month=this.value;render();">
          ${months.map(m=>`<option value="${m}" ${m===p.month?'selected':''}>${cap(monthLabel(m))}</option>`).join('')}
        </select>
      </div>
    ` : `
      <div class="row2">
        <div class="field" style="margin-bottom:0;"><label>Du</label><input type="date" value="${p.from}" onchange="periodStates.${prefix}.from=this.value;render();"></div>
        <div class="field" style="margin-bottom:0;"><label>Au</label><input type="date" value="${p.to}" onchange="periodStates.${prefix}.to=this.value;render();"></div>
      </div>
    `}
  </div>`;
}

/* ================= MOVEMENT LOGIC ================= */
function addMovement(type, data){
  const art = articleById(data.articleId);
  if(!art){ toast("Article introuvable"); return false; }
  const qty = Number(data.qty);
  if(!qty || qty<=0){ toast("Quantité invalide"); return false; }
  if((type==='sortie' || type==='vente') && qty > art.stock){
    toast(`Stock insuffisant (${fmtN(art.stock)} ${art.unit} dispo.)`); return false;
  }
  if(type==='entree' || type==='ajustement_plus') art.stock += qty;
  if(type==='sortie' || type==='vente' || type==='ajustement_moins') art.stock -= qty;

  const mv = {
    id: uid(), type, articleId: art.id, articleName: art.name, unit: art.unit,
    qty, date: data.date || new Date().toISOString(),
    party: data.party || '', ref: data.ref || '', note: data.note || '',
    unitPrice: data.unitPrice || 0, total: data.unitPrice ? Number(data.unitPrice)*qty : 0
  };
  movements.unshift(mv);
  persist();
  return mv;
}
function deleteMovement(id){
  const idx = movements.findIndex(m=>m.id===id);
  if(idx<0) return;
  const mv = movements[idx];
  const art = articleById(mv.articleId);
  if(art){
    if(mv.type==='entree' || mv.type==='ajustement_plus') art.stock -= mv.qty;
    if(mv.type==='sortie' || mv.type==='vente' || mv.type==='ajustement_moins') art.stock += mv.qty;
  }
  movements.splice(idx,1);
  persist();
  toast("Mouvement annulé");
  render();
}

/* ================= ARRIVAGES (réception -> triage par catégorie -> chambre froide) ================= */
function addArrival(data){
  const total = Number(data.totalReceived);
  if(!total || total<=0){ toast("Le nombre total reçu doit être supérieur à 0"); return false; }
  if(!data.provenance || !data.provenance.trim()){ toast("Merci d'indiquer la provenance (ferme)"); return false; }
  const ar = {
    id: uid(), date: data.date || new Date().toISOString(),
    provenance: data.provenance.trim(), totalReceived: total,
    status: 'attente', categories: [], createdAt: new Date().toISOString()
  };
  arrivals.unshift(ar);
  persist();
  return ar;
}
function deleteArrival(id){
  const idx = arrivals.findIndex(a=>a.id===id);
  if(idx<0) return;
  if(arrivals[idx].status==='trie'){ toast("Un arrivage déjà trié ne peut pas être supprimé (annulez plutôt les mouvements liés)."); return; }
  arrivals.splice(idx,1);
  persist();
  toast("Arrivage supprimé");
  render();
}
const DECOUPE_PRESETS = ['Ailes','Cuisses','Pattes','Gésiers','Cou','Blancs','Carcasse','Foie','Cœur'];

function confirmTriage(arrivalId, rows){
  const ar = arrivals.find(a=>a.id===arrivalId);
  if(!ar){ toast("Arrivage introuvable"); return false; }
  const clean = rows.filter(r=> Number(r.qty)>0);
  if(!clean.length){ toast("Ajoutez au moins un lot avec une quantité"); return false; }
  const sum = clean.reduce((s,r)=>s+Number(r.qty),0);
  if(sum !== ar.totalReceived){
    toast(`Le total des lots (${fmtN(sum)}) ne correspond pas au total reçu (${fmtN(ar.totalReceived)})`);
    return false;
  }
  // Validation : chaque lot de découpe doit avoir au moins un produit obtenu
  for(const r of clean){
    if(r.kind==='decoupe'){
      const validOutputs = (r.outputs||[]).filter(o=> ((o.articleId||o.articleName||'').toString().trim()) && Number(o.qty)>0);
      if(!validOutputs.length){ toast("Chaque lot destiné à la découpe doit avoir au moins un produit obtenu (ailes, cuisses...)"); return false; }
    }
  }

  const categories = [];
  clean.forEach(r=>{
    if(r.kind==='decoupe'){
      const validOutputs = (r.outputs||[]).filter(o=> ((o.articleId||o.articleName||'').toString().trim()) && Number(o.qty)>0);
      const savedOutputs = [];
      validOutputs.forEach(o=>{
        let art = o.articleId ? articleById(o.articleId) : null;
        if(!art){
          const name = (o.articleName||'').trim();
          art = articles.find(x=> x.name.toLowerCase() === name.toLowerCase());
        }
        if(!art){
          art = { id: uid(), name: (o.articleName||'').trim(), unit: o.unit||'kg', stock: 0, threshold: 5 };
          articles.push(art);
        }
        art.stock += Number(o.qty);
        movements.unshift({
          id: uid(), type:'entree', articleId: art.id, articleName: art.name, unit: art.unit,
          qty: Number(o.qty), date: ar.date, party: ar.provenance, ref: `Arrivage ${fmtDate(ar.date)} (découpe)`,
          note: `Issu de la découpe de ${fmtN(r.qty)} poulets — provenance : ${ar.provenance}`, unitPrice:0, total:0
        });
        savedOutputs.push({ articleId: art.id, articleName: art.name, qty: Number(o.qty), unit: art.unit });
      });
      // Traçabilité : combien de poulets sont partis en découpe (pas d'impact stock direct)
      movements.unshift({
        id: uid(), type:'decoupe_conso', articleId:'', articleName:'Poulets destinés à la découpe', unit:'pièce',
        qty: Number(r.qty), date: ar.date, party: ar.provenance, ref: `Arrivage ${fmtDate(ar.date)}`,
        note: `${fmtN(r.qty)} poulets transformés en : ${savedOutputs.map(o=>`${o.articleName} (${fmtN(o.qty)} ${o.unit})`).join(', ')}`,
        unitPrice:0, total:0
      });
      categories.push({ kind:'decoupe', qty: Number(r.qty), outputs: savedOutputs });
    } else {
      let art = articleById(r.articleId);
      if(!art){
        art = { id: uid(), name: r.articleName, unit: 'pièce', stock: 0, threshold: 10 };
        articles.push(art);
      }
      art.stock += Number(r.qty);
      movements.unshift({
        id: uid(), type:'entree', articleId: art.id, articleName: art.name, unit: art.unit,
        qty: Number(r.qty), date: ar.date, party: ar.provenance, ref: `Arrivage ${fmtDate(ar.date)}`,
        note: `Triage arrivage — provenance : ${ar.provenance}`, unitPrice:0, total:0
      });
      categories.push({ kind:'direct', articleId: art.id, articleName: art.name, qty: Number(r.qty) });
    }
  });
  ar.status = 'trie';
  ar.categories = categories;
  persist();
  toast("✓ Arrivage trié et envoyé en chambre froide");
  return true;
}

    ${!isEntree? `<div class="field"><label>Réf. commande (optionnel)</label><input id="f-ref" type="text" placeholder="Ex : CMD-014"></div>` : ''}
    <div class="field"><label>Note (optionnel)</label><textarea id="f-note" placeholder="Détails supplémentaires..."></textarea></div>
    <button class="btn ${isEntree?'btn-blue':'btn-amber'} full" onclick="submitMove('${type}')">Enregistrer ${isEntree?"l'ajustement":"la sortie"}</button>
  `);
}

function submitMove(type){
  const articleId = document.getElementById('f-article').value;
  const qty = document.getElementById('f-qty').value;
  const date = document.getElementById('f-date').value;
  const party = document.getElementById('f-party').value;
  const ref = document.getElementById('f-ref') ? document.getElementById('f-ref').value : '';
  const note = document.getElementById('f-note').value;
  const mv = addMovement(type, { articleId, qty, date, party, ref, note });
  if(!mv) return;
  closeSheet();
  toast(type==='entree'? 'Ajustement enregistré' : 'Sortie enregistrée');
  render();
  if(type==='sortie'){
    setTimeout(()=> showShareReceipt(mv), 250);
  }
}

function showShareReceipt(mv){
  const text = `Bon de sortie${mv.ref? ' '+mv.ref:''}\nArticle : ${mv.articleName}\nQuantité : ${fmtN(mv.qty)} ${mv.unit}\nDate : ${fmtDate(mv.date)}${mv.party? '\nClient : '+mv.party:''}${mv.note? '\nNote : '+mv.note:''}\n\n— ${settings.businessName}`;
  openSheet(`
    <div class="sheet-head"><h3>Sortie enregistrée</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <div class="receipt" style="white-space:pre-wrap;">${esc(text)}</div>
    <div class="row2" style="margin-top:16px;">
      <button class="btn btn-outline full" onclick="closeSheet()">Fermer</button>
      <a class="btn wa-btn full" style="text-decoration:none;justify-content:center;" target="_blank"
         href="https://wa.me/?text=${encodeURIComponent(text)}">Partager via WhatsApp</a>
    </div>
  `);
}

function shareSalesWhatsApp(){

/* ================= DEPENSES (EXPENSES) ================= */
function addExpense(data){
  const amount = Number(data.amount);
  if(!amount || amount<=0){ toast('Montant invalide'); return false; }
  if(!data.date){ toast('Date requise'); return false; }
  const ex = { id: uid(), date: data.date, category: data.category || 'Autre', amount, note: data.note || '' };
  expenses.unshift(ex);
  persist();
  return ex;
}
function deleteExpense(id){
  expenses = expenses.filter(e=>e.id!==id);
  persist(); toast('Dépense supprimée'); render();
}

function viewDepenses(){
  const months = getAvailableMonthsFrom(expenses);
  const list = filterByPeriod(expenses, 'date', periodStates.dep).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const total = list.reduce((s,e)=>s+Number(e.amount),0);

  const byCat = {};
  list.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + Number(e.amount); });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  return `
  <div class="quickrow"><button class="btn btn-primary full" onclick="openExpenseForm()">＋ Nouvelle dépense</button></div>

  ${periodFilterBar('dep', months)}

  <div class="stat-grid" style="margin-bottom:14px;grid-template-columns:1fr;">
    <div class="stat red"><div class="n">${fmtN(total)} ${settings.currency}</div><div class="l">Total ${periodLabel(periodStates.dep)} (${list.length} dépense${list.length>1?'s':''})</div></div>
  </div>

  <div class="quickrow">
    <button class="btn btn-outline full" onclick="printExpensesReport()">🖨 Imprimer / PDF</button>
    <button class="btn wa-btn full" onclick="shareExpensesWhatsApp()">Partager via WhatsApp</button>
  </div>

  <div class="card">
    <h2>Détail des dépenses</h2>
    ${list.length? list.map(e=>`
      <div class="list-row" onclick="showExpenseDetail('${e.id}')" style="cursor:pointer;">
        <div class="icon" style="background:var(--red)">🧾</div>
        <div class="body"><div class="t1">${esc(e.category)}</div><div class="t2">${fmtDate(e.date)}${e.note? ' · '+esc(e.note):''}</div></div>
        <div class="qty">${fmtN(e.amount)} ${settings.currency}</div>
      </div>`).join('') : `<div class="empty">Aucune dépense sur cette période.</div>`}
  </div>

  ${catRows.length? `
  <div class="card">
    <h2>Répartition par catégorie</h2>
    ${catRows.map(([cat,amt])=>`
      <div class="list-row">
        <div class="body"><div class="t1">${esc(cat)}</div></div>
        <div class="qty">${fmtN(amt)} ${settings.currency}</div>
      </div>`).join('')}

function printArrivalsReport(){
  const allDone = arrivals.filter(a=>a.status==='trie');

  const catLabel = c=> c.kind==='decoupe'
    ? `Découpe (${fmtN(c.qty)} poulets) → ${(c.outputs||[]).map(o=>`${esc(o.articleName)}: ${fmtN(o.qty)} ${o.unit}`).join(', ')}`
    : `${esc(c.articleName)}: ${fmtN(c.qty)}`;
  const rows = list.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.provenance)}</td><td style="text-align:right;">${fmtN(a.totalReceived)}</td><td>${a.categories.map(catLabel).join(' · ')}</td></tr>`).join('');
  const body = `
    <div class="print-stats">
      <div>Total poulets reçus<b>${fmtN(total)}</b></div>
      <div>Nombre d'arrivages<b>${list.length}</b></div>
    </div>
    <table class="print-table">
      <thead><tr><th>Date</th><th>Provenance</th><th style="text-align:right;">Total reçu</th><th>Répartition par lot</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4">Aucun arrivage sur cette période.</td></tr>`}</tbody>
    </table>`;
  printReport(`Rapport des arrivages — ${periodLabel(periodStates.arr)}`, body);
}
function shareArrivalsWhatsApp(){
  const allDone = arrivals.filter(a=>a.status==='trie');

  const catLabel = c=> c.kind==='decoupe'
    ? `Découpe ${fmtN(c.qty)} poulets → ${(c.outputs||[]).map(o=>`${o.articleName} ${fmtN(o.qty)}${o.unit}`).join(', ')}`

/* ---- Triage : lots directs (catégorie unique) ou lots destinés à la découpe (plusieurs produits obtenus) ---- */
let triageRows = [];
function openTriageForm(arrivalId){
  const ar = arrivals.find(a=>a.id===arrivalId); if(!ar) return;
  triageRows = ar.categories.length? ar.categories.map(c=>
    c.kind==='decoupe'
      ? { kind:'decoupe', qty:c.qty, outputs:(c.outputs||[]).map(o=>({...o})) }
      : { kind:'direct', articleId:c.articleId||'', articleName:c.articleName, qty:c.qty }
  ) : [{ kind:'direct', articleId:'', articleName:'', qty:'' }];
  renderTriageSheet(ar);
}
function renderTriageSheet(ar){
  const readOnly = ar.status==='trie';
  openSheet(`
    <div class="sheet-head"><h3>Triage — ${esc(ar.provenance)}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-4px 0 12px;">Total reçu le ${fmtDate(ar.date)} : <b>${fmtN(ar.totalReceived)} poulets</b>. Répartissez ce total par lot : soit une catégorie directe (poulet entier...), soit un lot destiné à la découpe (ailes, cuisses, pattes...).</p>
    <div id="triage-rows">${triageRows.map((r,i)=>triageRowHtml(r,i,readOnly)).join('')}</div>
    ${!readOnly? `<button class="btn-ghost" onclick="addTriageRow()" style="margin:6px 0 14px;">＋ Ajouter un lot</button>` : ''}
    <div id="triage-total" class="list-row" style="background:var(--bg-soft,#f5f4f0);border-radius:10px;">
      <div class="body"><div class="t1">Total réparti (en poulets)</div></div>
      <div class="qty" id="triage-sum-display">0 / ${fmtN(ar.totalReceived)}</div>
    </div>
    ${!readOnly? `<button class="btn btn-primary full" style="margin-top:14px;" onclick="submitTriage('${ar.id}')">Valider et envoyer en chambre froide</button>` : ''}
  `);
  updateTriageSum(ar.totalReceived);
}
function triageRowHtml(r,i,readOnly){
  const kindTabs = !readOnly ? `
    <div class="row2" style="margin-bottom:8px;">
      <button type="button" class="chip ${r.kind==='direct'?'active':''}" onclick="setTriageRowKind(${i},'direct')" style="flex:1;justify-content:center;">Catégorie directe</button>
      <button type="button" class="chip ${r.kind==='decoupe'?'active':''}" onclick="setTriageRowKind(${i},'decoupe')" style="flex:1;justify-content:center;">Destiné à la découpe</button>
    </div>` : '';

  if(r.kind==='decoupe'){
    return `
    <div class="card" style="background:var(--amber-soft);border:1px solid var(--amber);margin-bottom:10px;padding:12px;" data-row="${i}">
      ${kindTabs}
      <div class="field" style="margin-bottom:8px;">
        <label>Poulets destinés à la découpe</label>
        <input ${readOnly?'disabled':''} type="number" min="0" step="1" value="${r.qty}" oninput="onTriageQtyChange(${i}, this.value)">
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Produits obtenus après découpe :</div>
      ${(r.outputs||[]).map((o,j)=>decoupeOutputRowHtml(o,i,j,readOnly)).join('') || (readOnly? `<div style="font-size:12.5px;color:var(--ink-soft);">Aucun produit renseigné.</div>` : '')}
      ${!readOnly? `
        <button type="button" class="btn-ghost" onclick="addDecoupeOutput(${i})" style="margin:2px 0 8px;">＋ Ajouter un produit</button>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;">
          ${DECOUPE_PRESETS.map(p=>`<button type="button" class="chip" style="font-size:11px;" onclick="addDecoupeOutput(${i}, '${esc(p)}')">＋ ${esc(p)}</button>`).join('')}
        </div>
        <button type="button" class="btn-ghost" onclick="removeTriageRow(${i})" style="color:var(--red);font-size:12.5px;">✕ Retirer ce lot</button>
      `:''}
    </div>`;
  }

  const options = articles.map(a=>`<option value="${a.id}" ${a.id===r.articleId?'selected':''}>${esc(a.name)}</option>`).join('');
  return `
  <div class="card" style="border:1px solid var(--line);margin-bottom:10px;padding:12px;" data-row="${i}">
    ${kindTabs}
    <div class="row2" style="align-items:end;">
      <div class="field" style="margin-bottom:0;">
        <label>Catégorie</label>
        <select ${readOnly?'disabled':''} onchange="onTriageArticleChange(${i}, this.value)">
          <option value="">— Nouvelle catégorie —</option>
          ${options}
        </select>
        ${!r.articleId? `<input ${readOnly?'disabled':''} type="text" placeholder="Nom de la nouvelle catégorie" value="${esc(r.articleName)}" style="margin-top:6px;" oninput="triageRows[${i}].articleName=this.value">` : ''}
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Quantité</label>

function decoupeOutputRowHtml(o,i,j,readOnly){

    </div>

function setTriageRowKind(i, kind){
  const keepQty = triageRows[i].qty || '';
  triageRows[i] = kind==='decoupe'
    ? { kind:'decoupe', qty:keepQty, outputs:[] }
    : { kind:'direct', articleId:'', articleName:'', qty:keepQty };
  reRenderTriageRows();
}
function onTriageArticleChange(i, articleId){
  const art = articleById(articleId);
  triageRows[i].articleId = articleId;
  triageRows[i].articleName = art ? art.name : '';
  reRenderTriageRows();
}
function onTriageQtyChange(i, val){
  triageRows[i].qty = Number(val)||0;
  updateTriageSumFromDOM();
}
function addDecoupeOutput(i, presetName){
  if(!triageRows[i].outputs) triageRows[i].outputs = [];
  triageRows[i].outputs.push({ articleId:'', articleName: presetName||'', qty:'', unit:'kg' });
  reRenderTriageRows();
}
function removeDecoupeOutput(i,j){
  triageRows[i].outputs.splice(j,1);
  reRenderTriageRows();
}
function onDecoupeOutputArticleChange(i,j,articleId){
  const art = articleById(articleId);
  triageRows[i].outputs[j].articleId = articleId;
  triageRows[i].outputs[j].articleName = art ? art.name : '';
  if(art) triageRows[i].outputs[j].unit = art.unit || triageRows[i].outputs[j].unit;
  reRenderTriageRows();
}
function onDecoupeOutputQtyChange(i,j,val){
  triageRows[i].outputs[j].qty = Number(val)||0;
}
function removeTriageRow(i){
  triageRows.splice(i,1);
  if(!triageRows.length) triageRows.push({ kind:'direct', articleId:'', articleName:'', qty:'' });
  reRenderTriageRows();
}
function reRenderTriageRows(){
  const container = document.getElementById('triage-rows');
  if(!container) return;
  container.innerHTML = triageRows.map((r,i)=>triageRowHtml(r,i,false)).join('');
  updateTriageSumFromDOM();
}
function addTriageRow(){
  triageRows.push({ kind:'direct', articleId:'', articleName:'', qty:'' });
  reRenderTriageRows();
}
function updateTriageSumFromDOM(){
  const totalEl = document.getElementById('triage-sum-display');
  if(!totalEl) return;
  const target = totalEl.textContent.split('/')[1] ? Number(totalEl.textContent.split('/')[1].replace(/\s|\u00A0|[^\d]/g,'')) : 0;
  updateTriageSum(target);
}
function updateTriageSum(totalReceived){
  const sum = triageRows.reduce((s,r)=>s+(Number(r.qty)||0),0);
  const el = document.getElementById('triage-sum-display');
  const row = document.getElementById('triage-total');
  if(!el) return;
  el.textContent = `${fmtN(sum)} / ${fmtN(totalReceived)}`;
  const ok = sum === Number(totalReceived);
  el.style.color = ok ? 'var(--green)' : 'var(--red)';
  if(row) row.style.background = ok ? 'rgba(34,150,90,.12)' : 'rgba(210,60,50,.10)';
}
function submitTriage(arrivalId){
  const ar = arrivals.find(a=>a.id===arrivalId); if(!ar) return;
  const rows = triageRows.map(r=>{
    if(r.kind==='decoupe'){
      return {
        kind:'decoupe', qty: Number(r.qty)||0,
        outputs: (r.outputs||[]).map(o=>({
          articleId: o.articleId||'',
          articleName: o.articleId ? (articleById(o.articleId)?.name||o.articleName) : (o.articleName||'').trim(),
          qty: Number(o.qty)||0, unit: o.unit||'kg'
        }))
      };
    }
    return {
      kind:'direct', articleId: r.articleId||'',
      articleName: r.articleId ? (articleById(r.articleId)?.name||r.articleName) : (r.articleName||'').trim(),
      qty: Number(r.qty)||0
    };
  }).filter(r=> r.kind==='decoupe' ? true : !!r.articleName);
  const ok = confirmTriage(arrivalId, rows);
  if(!ok) return;
  closeSheet();
  render();
}

function submitArticle(id){
  const name = document.getElementById('f-name').value.trim();
  const unit = document.getElementById('f-unit').value;
  const threshold = Number(document.getElementById('f-threshold').value || 0);
  if(!name){ toast('Nom requis'); return; }
  if(id){
    const a = articleById(id);
    const stockInput = document.getElementById('f-stock');
    const newStock = Number(stockInput.value || 0);
    if(newStock !== a.stock){
      const diff = newStock - a.stock;
      movements.unshift({ id:uid(), type: diff>0?'ajustement_plus':'ajustement_moins', articleId:a.id, articleName:name,
        unit, qty:Math.abs(diff), date:new Date().toISOString(), party:'', ref:'', note:'Ajustement manuel', unitPrice:0, total:0 });
    }
    a.name = name; a.unit = unit; a.threshold = threshold; a.stock = newStock;
  } else {
    articles.push({ id: uid(), name, unit, stock:0, threshold });
  }
  persist(); closeSheet(); toast('Article enregistré'); render();
}

function deleteArticle(id){
  if(!confirm("Supprimer cet article ? L'historique des mouvements associés sera conservé.")) return;
  articles = articles.filter(a=>a.id!==id);
  persist(); closeSheet(); toast('Article supprimé'); render();
}

function exportData(){
  const data = { settings, articles, movements, expenses, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sauvegarde-stock-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée');
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.articles || !data.movements) throw new Error('format invalide');
      if(!confirm('Importer ces données remplacera toutes les données actuelles. Continuer ?')) return;
      settings = data.settings || settings; articles = data.articles; movements = data.movements; expenses = data.expenses || [];
      persist(); render(); toast('Données importées');
    }catch(err){ toast("Fichier invalide"); }
  };
  reader.readAsText(file);
}

function resetAll(){
  if(!confirm('Cette action supprimera définitivement toutes les données. Confirmer ?')) return;
  if(!confirm('Dernière confirmation : voulez-vous vraiment tout réinitialiser ?')) return;
  localStorage.removeItem(DB_KEYS.settings); localStorage.removeItem(DB_KEYS.articles); localStorage.removeItem(DB_KEYS.movements); localStorage.removeItem(DB_KEYS.expenses); localStorage.removeItem(DB_KEYS.arrivals);
  const finish = ()=> location.reload();
  if(supa){ supa.from('app_state').delete().neq('key','').then(finish).catch(finish); }
  else finish();
}

/* ================= SHEET / MODAL HELPERS ================= */
function openSheet(html){
  closeSheet();
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'active-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
  overlay.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(overlay);
}
function closeSheet(){ const o = document.getElementById('active-overlay'); if(o) o.remove(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= PRINT / PDF REPORTS ================= */
function printReport(title, bodyHtml){
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div class="print-header">
      <div><h1>${esc(settings.businessName)}</h1></div>
      <div class="meta">Généré le ${fmtDate(new Date().toISOString())}<br>${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="print-title">${esc(title)}</div>
    ${bodyHtml}
    <div class="print-footer">${esc(settings.businessName)} — document généré depuis l'application de gestion de stock</div>
  `;
  document.body.classList.add('print-mode');
  setTimeout(()=>{ window.print(); }, 80);
}
window.addEventListener('afterprint', ()=>{ document.body.classList.remove('print-mode'); });

/* ================= PWA (manifest + service worker en fichiers réels) ================= */
(function setupPWA(){
  try{
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
    const link2 = document.createElement('link'); link2.rel='icon'; link2.href = 'icons/icon-192.png'; document.head.appendChild(link2);
    const link3 = document.createElement('link'); link3.rel='apple-touch-icon'; link3.href = 'icons/icon-192.png'; document.head.appendChild(link3);
  }catch(e){}

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();

/* ================= INSTALL PROMPT ================= */
(function setupInstallBanner(){
  const DISMISS_KEY = 'abattoir_install_dismissed';
  const banner = document.getElementById('installBanner');
  let deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function dismissed(){ return localStorage.getItem(DISMISS_KEY) === '1'; }

  function showBanner(mode){
    if(isStandalone() || dismissed()) return;
    if(mode === 'ios'){
      banner.innerHTML = `
        <img src="${LOGO_192}" alt="logo">
        <div class="txt"><b>Installer l'application</b><span>Bouton Partager ⬆ puis "Sur l'écran d'accueil"</span></div>
        <div class="acts"><button class="dismiss" onclick="dismissInstallBanner()">OK</button></div>`;
    } else {
      banner.innerHTML = `
        <img src="${LOGO_192}" alt="logo">
        <div class="txt"><b>Installer l'application</b><span>Accès rapide, hors ligne, comme une vraie app</span></div>
        <div class="acts">
          <button class="go" onclick="triggerInstall()">Installer</button>
          <button class="dismiss" onclick="dismissInstallBanner()">Plus tard</button>
        </div>`;
    }
    banner.classList.add('show');
  }

  window.dismissInstallBanner = function(){
    banner.classList.remove('show');
    localStorage.setItem(DISMISS_KEY, '1');
  };
  window.triggerInstall = function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice=>{
      if(choice.outcome === 'accepted') banner.classList.remove('show');
      deferredPrompt = null;
    });
  };

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    showBanner('android');
  });

  window.addEventListener('appinstalled', ()=>{
    banner.classList.remove('show');
    localStorage.setItem(DISMISS_KEY, '1');
    toast('✓ Application installée avec succès !');
  });

  if(isIOS() && !isStandalone() && !dismissed()){
    setTimeout(()=> showBanner('ios'), 1200);
  }
})();

/* ================= INIT ================= */
render();
initCloudSync();
</script>
