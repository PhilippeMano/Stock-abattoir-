name: Generer APK HTML

on:
  push:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code HTML
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer et Initialiser Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mon App HTML" "com.monapp.html" --web-dir=.
          npx cap add android
          npx cap sync

      - name: Compiler l'APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Televerser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MonApp-HTML-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
