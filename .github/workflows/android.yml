name: Generer APK HTML

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code HTML
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurer Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Installer et Initialiser Capacitor
      run: |
        npm init -y
        npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
        
        # 1. Préparation du dossier web
        mkdir -p www
        cp -r * www/ 2>/dev/null || true
        
        # 2. Création de l'application Android
        npx cap init "Stock Abattoir" "com.philippemano.stock" --web-dir=www
        npx cap add android

    - name: Appliquer les correctifs système Android (Obligatoire)
      run: |
        # Force le projet Android à utiliser les outils de compilation récents et stables
        sed -i 's/compileSdkVersion =.*/compileSdkVersion = 34/g' android/variables.gradle
        sed -i 's/targetSdkVersion =.*/targetSdkVersion = 34/g' android/variables.gradle
        sed -i 's/androidxActivityVersion =.*/androidxActivityVersion = "1.8.2"/g' android/variables.gradle

    - name: Synchroniser Capacitor
      run: npx cap sync android

    - name: Compiler l'APK Android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Televerser l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Mon-APK-Stock
        path: android/app/build/outputs/apk/debug/app-debug.apk
