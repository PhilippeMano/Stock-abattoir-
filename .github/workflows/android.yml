name: Build APK

on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest


steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Installer et Initialiser Capacitor
      run: |
        npm install
        npm install @capacitor/cli @capacitor/core @capacitor/android
        # Crée un dossier factice 'www' pour que Capacitor accepte de s'initialiser
        mkdir -p www
        # Force l'initialisation avec le dossier web correct et crée le dossier android
        npx cap init "Stock Abattoir" "com.philippemano.stock" --web-dir=www
        npx cap add android

    - name: Synchroniser Capacitor
      run: npx cap sync android

    - name: Compiler l'APK Android
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Televerser l'APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
