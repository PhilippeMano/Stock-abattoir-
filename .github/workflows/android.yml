name: Generer APK HTML

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Post Recuperer le code HTML
      uses: actions/checkout@v4

    - name: Post Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Post Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Installer et Initialiser Capacitor
      run: |
        npm init -y
        npm install @capacitor/cli @capacitor/core @capacitor/android
        
        # 1. Crée un dossier web nommé 'www' exigé par Capacitor
        mkdir -p www
        
        # 2. Copie tous vos fichiers HTML/CSS/JS du dépôt dans ce dossier 'www'
        cp -r * www/ 2>/dev/null || true
        
        # 3. Initialise Capacitor avec le dossier valide et génère le dossier android
        npx cap init "Stock Abattoir" "com.philippemano.stock" --web-dir=www
        npx cap add android

    - name: Synchroniser Capacitor
      run: npx cap sync android

    - name: Compiler l'APK Android
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Televerser l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Mon-APK-Stock
        path: android/app/build/outputs/apk/debug/app-debug.apk
